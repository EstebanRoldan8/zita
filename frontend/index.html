<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/favicon-256.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZITA — Gestión Inteligente</title>
    <meta name="theme-color" content="#0d1117" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ZITA" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <!-- Syne y DM Sans son del panel: en la tienda (/tienda... o dominio propio) no se piden a Google Fonts. -->
    <script>
      (function () {
        var h = location.hostname.toLowerCase(), sh = '%VITE_STORE_HOST%'.toLowerCase();
        if (/^\/tienda(\/|$)/.test(location.pathname) || h === sh) return;
        var l = document.createElement('link');
        l.rel = 'stylesheet';
        l.href = 'https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap';
        document.head.appendChild(l);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
